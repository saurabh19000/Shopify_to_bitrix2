# ============================================================
# Shopify → Bitrix24 Integration - Production Deployment
#   shopify-backend : Express 4 backend (port 3001)
#
# Backend handles Shopify webhooks (HMAC-verified) + OAuth +
# bulk migration + two-way sync with Bitrix24 CRM.
#
# Uses the CENTRALISED Postgres container (hostname `postgres`,
# shared by all apps on the server via prod-network).
#
# Services join the shared prod-network so the central nginx
# reverse proxy (nginx/conf.d/shopify.conf) can reach them
# by container name.
# ============================================================
version: "3.9"

services:

  shopify-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopify-backend
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env
    environment:
      - DATABASE_URL="postgresql://shopify:shopify7897@postgres:5432/shopify"
      - NODE_ENV=production
      - PORT=3001
    networks:
      - prod-network

networks:
  prod-network:
    external: true

